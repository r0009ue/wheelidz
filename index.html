<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheely DZ - Location de Vélos Électriques | Campus Bab Ezzouar</title>
    <style>
        /* Same styles as your original file */
        :root {
            --primary: #00b894;
            --primary-dark: #00916f;
            --secondary: #0984e3;
            --accent: #fdcb6e;
            --dark: #2d3436;
            --light: #dfe6e9;
            --white: #ffffff;
            --success: #00b894;
            --warning: #fdcb6e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--dark);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Modal Styles (same as original) */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background: white;
            margin: 10% auto;
            padding: 2rem;
            border-radius: 15px;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            position: relative;
            animation: slideDown 0.3s;
        }

        .close-modal {
            position: absolute;
            right: 1.5rem;
            top: 1.5rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #999;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-modal:hover {
            color: var(--primary);
        }

        /* other styles ... */
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer and other sections */
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <nav>
                <!-- Navigation buttons and content -->
            </nav>
        </div>
    </header>

    <!-- Modal Solde -->
    <div id="soldeModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeSoldeModal">&times;</span>
            <h2>💰 Mon Solde</h2>
            <div class="solde-amount" id="currentSolde">0 DA</div>
            <form id="depositForm">
                <div class="form-group">
                    <label for="depositAmount">Montant à déposer (DA)</label>
                    <input type="number" id="depositAmount" class="deposit-input" required placeholder="Ex: 1000" min="100" step="50">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    💳 Déposer
                </button>
            </form>
        </div>
    </div>

    <!-- Modal Profile -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeProfileModal">&times;</span>
            <h2>👤 Mon Profil</h2>
            <div id="profileContent"></div>
        </div>
    </div>

    <!-- Modal Login -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2>🔐 Connexion</h2>
            <form id="authForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="authEmail" required placeholder="votre.email@usthb.dz">
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="authPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
                    Se connecter
                </button>
            </form>
        </div>
    </div>

    <!-- JavaScript for Modal Toggling -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            /* ================= ELEMENTS ================= */
            const loginBtn = document.getElementById("loginBtn");
            const loginModal = document.getElementById("loginModal");
            const closeModal = document.getElementById("closeModal");

            const soldeModal = document.getElementById("soldeModal");
            const closeSoldeModal = document.getElementById("closeSoldeModal");

            const profileModal = document.getElementById("profileModal");
            const closeProfileModal = document.getElementById("closeProfileModal");

            /* ================= LOGIN MODAL ================= */
            loginBtn.addEventListener("click", function () {
                const token = localStorage.getItem("token");
                if (!token) {
                    loginModal.style.display = "block";
                } else {
                    // Display profile menu
                }
            });

            closeModal.onclick = () => loginModal.style.display = "none";

            /* ================= SOLDE MODAL ================= */
            const soldeBtn = document.getElementById("soldeBtn");
            soldeBtn.onclick = () => soldeModal.style.display = "block";
            closeSoldeModal.onclick = () => soldeModal.style.display = "none";

            /* ================= PROFILE MODAL ================= */
            const profileBtn = document.getElementById("profileBtn");
            profileBtn.addEventListener("click", () => {
                profileModal.style.display = "block";
                loadProfileData();
            });

            closeProfileModal.onclick = () => profileModal.style.display = "none";

            window.addEventListener("click", (event) => {
                if (event.target === profileModal) {
                    profileModal.style.display = "none";
                }
                if (event.target === soldeModal) {
                    soldeModal.style.display = "none";
                }
                if (event.target === loginModal) {
                    loginModal.style.display = "none";
                }
            });

            /* ================= PROFILE DATA ================= */
            async function loadProfileData() {
                const token = localStorage.getItem("token");
                if (!token) {
                    alert("Veuillez vous connecter");
                    return;
                }

                const response = await fetch("https://wheely-dz-server.onrender.com/profile", {
                    headers: { Authorization: "Bearer " + token },
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById("profileContent").innerHTML = `
                        <p><strong>Nom:</strong> ${data.nom}</p>
                        <p><strong>Email:</strong> ${data.email}</p>
                        <p><strong>Solde:</strong> ${data.solde} DA</p>
                    `;
                } else {
                    alert("Erreur lors du chargement du profil");
                }
            }

            // Initialize modal display for existing sessions
            updateUI();
        });
    </script>
</body>
</html>
